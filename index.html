<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
  :root {
    --bg: #1b1c1f;
    --panel: #232427;
    --display: #16171a;
    --accent: #ff9f43;
    --op-bg: #3a3b40;
    --key-bg: #2e2f33;
    --key-hover: #3a3b40;
    --text: #f4f4f2;
    --muted: #8a8b90;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .calculator {
    width: 320px;
    background: var(--panel);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }

  .display {
    background: var(--display);
    border-radius: 14px;
    padding: 24px 18px 16px;
    margin-bottom: 18px;
    text-align: right;
    overflow: hidden;
  }

  .display .prev {
    color: var(--muted);
    font-size: 15px;
    min-height: 18px;
    margin-bottom: 6px;
    word-wrap: break-word;
  }

  .display .current {
    color: var(--text);
    font-size: 40px;
    font-weight: 300;
    word-wrap: break-word;
    line-height: 1.1;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 19px;
    padding: 18px 0;
    cursor: pointer;
    background: var(--key-bg);
    color: var(--text);
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.96); }

  button.op {
    background: var(--op-bg);
    color: var(--accent);
    font-weight: 600;
  }

  button.op:hover { background: #45464c; }

  button.equals {
    background: var(--accent);
    color: #1b1c1f;
    font-weight: 700;
  }

  button.equals:hover { background: #ffb166; }

  button.span-2 { grid-column: span 2; }

  button.func {
    color: var(--muted);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="keys">
    <button class="func" onclick="clearAll()">AC</button>
    <button class="func" onclick="deleteLast()">DEL</button>
    <button class="func" onclick="toggleSign()">+/-</button>
    <button class="op" onclick="chooseOp('÷')">÷</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="op" onclick="chooseOp('×')">×</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="op" onclick="chooseOp('-')">-</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="op" onclick="chooseOp('+')">+</button>

    <button class="span-2" onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let current = '0';
  let previous = '';
  let operation = null;
  let resetNext = false;

  const currentEl = document.getElementById('current');
  const prevEl = document.getElementById('prev');

  function updateDisplay() {
    currentEl.textContent = current;
    prevEl.textContent = previous && operation ? `${previous} ${operation}` : '';
  }

  function appendNumber(num) {
    if (resetNext) {
      current = '0';
      resetNext = false;
    }
    if (num === '.' && current.includes('.')) return;
    current = current === '0' && num !== '.' ? num : current + num;
    updateDisplay();
  }

  function chooseOp(op) {
    if (operation && !resetNext) calculate();
    previous = current;
    operation = op;
    resetNext = true;
    updateDisplay();
  }

  function toggleSign() {
    current = (parseFloat(current) * -1).toString();
    updateDisplay();
  }

  function deleteLast() {
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  function clearAll() {
    current = '0';
    previous = '';
    operation = null;
    resetNext = false;
    updateDisplay();
  }

  function calculate() {
    if (!operation || previous === '') return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result;
    switch (operation) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b === 0 ? 'Error' : a / b; break;
    }
    current = (typeof result === 'number') ? +result.toFixed(10) + '' : result;
    previous = '';
    operation = null;
    resetNext = true;
    updateDisplay();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    else if (e.key === '.') appendNumber('.');
    else if (e.key === '+') chooseOp('+');
    else if (e.key === '-') chooseOp('-');
    else if (e.key === '*') chooseOp('×');
    else if (e.key === '/') { e.preventDefault(); chooseOp('÷'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
  });
</script>

</body>
</html>
